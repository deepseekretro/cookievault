<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8" />
<style>body{width:260px;padding:12px;font:13px system-ui;background:#f8fafc;color:#1e293b}input{width:100%;box-sizing:border-box;margin:6px 0;padding:6px;background:#fff;border:1px solid #e2e8f0;border-radius:6px;color:#1e293b}button{width:100%;margin:4px 0;padding:7px;background:#fff;border:1px solid #e2e8f0;border-radius:6px;color:#1e293b;cursor:pointer}#save{background:#2563eb;color:#fff;border-color:#2563eb}</style>
</head><body>
<h3 style="margin:4px 0">CookieVault</h3>
<div id="info" class="muted">当前域名：…</div>
<input id="label" placeholder="账号标签 *（如 张三-工作账号）" />
<input id="note" placeholder="备注（可选）" />
<button id="save">保存当前登录状态</button>
<button id="clear">清空当前站点 Cookie</button>
<button id="open">打开管理面板</button>
<button id="options">连接 / 解锁设置</button>
<div id="msg"></div>
<script src="popup.js"></script>
</body></html>
