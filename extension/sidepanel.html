<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CookieVault</title>
<link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <nav class="tabbar">
    <button class="tab active" data-tab="data">数据</button>
    <button class="tab" data-tab="settings">设置</button>
  </nav>

  <!-- ======== Tab: 数据 ======== -->
  <div id="tab-data">
  <div id="view-list">
    <header class="topbar">
      <div class="search-row">
        <span class="search-icon">🔍</span>
        <input id="search" type="search" placeholder="搜索标签 / 域名 / 备注…（按 / 聚焦）" autocomplete="off" />
        <button id="search-clear" class="icon-btn hidden" title="清除搜索">✕</button>
      </div>
      <div class="filter-row">
        <label class="chip">站点分组（主域名）
          <select id="filter-group"><option value="">全部站点</option></select>
        </label>
        <label class="chip"><input type="checkbox" id="filter-current-domain" /> 仅当前域名</label>
        <label class="chip">排序
          <select id="sort">
            <option value="last_used_at:desc">最近使用</option>
            <option value="created_at:desc">创建时间 ↓</option>
            <option value="created_at:asc">创建时间 ↑</option>
            <option value="label:asc">标签 A-Z</option>
          </select>
        </label>
        <button id="save-btn" class="btn primary small">＋ 保存当前</button>
        <button id="clear-current-btn" class="btn small danger" title="清空当前站点（当前标签页域名）的全部 Cookie">清空当前站点</button>
      </div>
      <div id="save-row" class="save-row hidden">
        <input id="save-label" type="text" placeholder="账号标签 *（如 张三-工作账号）" />
        <input id="save-note" type="text" placeholder="备注（可选）" />
        <button id="save-confirm" class="btn primary small">保存</button>
        <button id="save-cancel" class="btn small">取消</button>
      </div>
    </header>

    <div id="locked-banner" class="banner hidden">
      🔒 服务端已锁定，请到「设置」Tab 解锁。
    </div>
    <div id="error-banner" class="banner error hidden">
      <span id="error-text"></span>
      <button id="error-retry" class="link-btn">重试</button>
    </div>

    <main id="scroll" class="scroll">
      <div id="spacer" class="spacer">
        <div id="window" class="window"></div>
      </div>
      <div id="end-sentinel" class="sentinel"></div>
      <div id="list-status" class="list-status"></div>
    </main>

    <footer class="statusbar">
      <span id="count-text">未加载</span>
      <button id="to-top" class="link-btn hidden">回到顶部 ↑</button>
    </footer>
  </div>

  <!-- ======== Detail view ======== -->
  <div id="view-detail" class="hidden">
    <header class="topbar">
      <div class="detail-head">
        <button id="back-btn" class="btn small">‹ 返回</button>
        <div class="detail-title">
          <strong id="detail-label"></strong>
          <span id="detail-meta" class="muted"></span>
        </div>
        <button id="restore-btn" class="btn primary small">恢复此快照</button>
        <button id="clear-btn" class="btn small danger">清空当前站点</button>
        <button id="compare-btn" class="btn small">对比</button>
        <button id="export-btn" class="btn small">导出</button>
      </div>
      <div class="search-row">
        <span class="search-icon">🔍</span>
        <input id="cookie-search" type="search" placeholder="在快照内搜索 Cookie 名 / 域名…" autocomplete="off" />
      </div>
      <span class="chip">恢复时会自动清空当前站点 Cookie</span>
      <label class="chip"><input type="checkbox" id="restore-backup" checked /> 恢复前先备份当前</label>
    </header>
    <main id="cookie-scroll" class="scroll">
      <div class="cookie-head muted">名称 / 域名 / 属性（值已脱敏）</div>
      <div id="cookie-spacer" class="spacer">
        <div id="cookie-window" class="window"></div>
      </div>
      <div id="cookie-status" class="list-status"></div>
    </main>
  </div>
  </div><!-- /tab-data -->

  <!-- ======== Tab: 设置 ======== -->
  <div id="tab-settings" class="hidden">
    <main class="settings-scroll">
      <section class="panel-card">
        <h3>服务端连接</h3>
        <label>服务端地址
          <input id="set-serverUrl" placeholder="http://127.0.0.1:18765 或 https://edge02.10w123.com/cookievault" /></label>
        <label>配对码（服务端启动日志里，5 分钟有效）
          <input id="set-pairCode" placeholder="8 位数字" /></label>
        <button id="set-pair" class="btn primary small">用配对码连接</button>
        <span id="set-conn-status" class="muted"></span>
      </section>

      <section class="panel-card">
        <h3>主密码（加密密钥）</h3>
        <div id="set-status" class="muted">状态查询中…</div>
        <div id="set-setup-box">
          <label>首次使用：设置主密码（至少 8 位）<input id="set-setup-pw" type="password" /></label>
          <button id="set-setup" class="btn primary small">设置主密码并解锁</button>
        </div>
        <div id="set-unlock-box">
          <label>解锁<input id="set-unlock-pw" type="password" /></label>
          <button id="set-unlock" class="btn primary small">解锁</button>
          <button id="set-lock" class="btn small">锁定</button>
        </div>
        <div id="set-change-box">
          <label>改主密码 — 旧密码<input id="set-old-pw" type="password" /></label>
          <label>新密码<input id="set-new-pw" type="password" /></label>
          <button id="set-change" class="btn small">修改主密码</button>
        </div>
        <p class="muted">主密码遗忘 = 数据不可恢复。</p>
      </section>

      <section class="panel-card">
        <h3>闲置自动锁定</h3>
        <label>无操作分钟数（0 = 禁用）<input id="set-idle-minutes" type="number" min="0" /></label>
        <label class="check"><input type="checkbox" id="set-auto-backup-before-lock" /> 锁定前自动备份当前域名 Cookie</label>
        <button id="set-save-settings" class="btn primary small">保存设置</button>
      </section>

      <section class="panel-card">
        <h3>加密备份</h3>
        <label>备份密码（至少 8 位）<input id="set-backup-pw" type="password" /></label>
        <button id="set-export" class="btn small">导出备份文件</button>
        <hr />
        <label>导入备份文件<input id="set-import-file" type="file" accept=".json,application/json" /></label>
        <button id="set-import" class="btn small">导入备份</button>
        <span id="set-backup-status" class="muted"></span>
      </section>

      <div id="set-msg" class="muted"></div>
    </main>
  </div>

  <!-- ======== Modal ======== -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn">取消</button>
        <button id="modal-ok" class="btn primary">确认</button>
      </div>
    </div>
  </div>

  <!-- ======== Compare modal ======== -->
  <div id="compare-modal" class="modal hidden">
    <div class="modal-card" style="max-width:460px">
      <div class="modal-title">快照对比</div>
      <div class="modal-body">
        <div id="compare-base" class="muted" style="margin-bottom:6px"></div>
        <label>与之对比：<select id="compare-target" style="width:100%;margin-top:4px"></select></label>
        <div id="compare-result" style="margin-top:10px;max-height:300px;overflow:auto"></div>
      </div>
      <div class="modal-actions">
        <button id="compare-close" class="btn">关闭</button>
        <button id="compare-run" class="btn primary">开始对比</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="sidepanel.js"></script>
</body>
</html>
