# 把下面这段 location 放进 edge02.10w123.com 的 443（及 8080）server 块里，
# 放在 `location / { ... }` 之前。
#
# 安全说明：
# - 此路径必须 auth_basic off：浏览器扩展的 fetch 无法处理 Basic Auth 弹窗，
#   鉴权完全依靠 CookieVault 自身的 Bearer Token + 主密码解锁。
# - 该路径暴露在公网，所有请求仍受服务端 Host 白名单 + Token + 解锁状态三重校验；
#   Go 服务本身只监听 127.0.0.1，公网无法直连。
# - 建议在 nginx.conf 的 http 块加限流 zone 后在此加 limit_req（防暴力解锁）：
#     limit_req_zone $binary_remote_addr zone=cookievault:10m rate=10r/s;

location /cookievault/ {
    auth_basic off;
    # limit_req zone=cookievault burst=20 nodelay;
    include snippets/cookievault-proxy.conf;
}

# 精确匹配 /cookievault（无尾斜杠）时补一个跳转，避免落到默认 location
location = /cookievault {
    auth_basic off;
    return 301 /cookievault/;
}
